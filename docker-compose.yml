version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gmsh-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-gmsh_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gmsh_password}
      POSTGRES_DB: ${DB_NAME:-gmsh_dev}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gmsh-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-gmsh_user}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gmsh-redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - gmsh-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmsh-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-gmsh_user}:${DB_PASSWORD:-gmsh_password}@postgres:5432/${DB_NAME:-gmsh_dev}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-here}
      PORT: 5000
    ports:
      - '${API_PORT:-5000}:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules
    networks:
      - gmsh-network
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gmsh-frontend
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
    ports:
      - '${APP_PORT:-3000}:5173'
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    networks:
      - gmsh-network
    command: npm run dev -- --host

volumes:
  postgres_data:
  redis_data:

networks:
  gmsh-network:
    driver: bridge
